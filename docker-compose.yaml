services:
  spring-restaurant-ordering-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-restaurant-ordering-api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - PORT=${APP_PORT:-8080}
      ## postgresql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always

  postgres:
    image: postgres:16.8
    container_name: postgres-restaurant
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    extra_hosts:
    ###   - "host.docker.internal:host-gateway" ## Docker
       - "host.containers.internal:host-gateway" ## Podman