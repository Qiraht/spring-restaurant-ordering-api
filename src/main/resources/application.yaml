spring:
  application:
    name: food-order

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:${DB_PORT:5432}}/food_order
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:supersecretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  liquibase:
    enabled: false
