spring:
  application:
    name: food-order

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost:${DB_PORT:5432}}/food_order
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:supersecretpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  liquibase:
    enabled: false

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: FRAMEWORK

app:
  jwt:
    secret: "ce1c509fb3095945d30931af14a5df5a437c9607f18ba6aea9530385e7b4afb4"
    expiration: 3600000
